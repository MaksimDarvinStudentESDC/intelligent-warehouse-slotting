name: Automated Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend (Java 25, JUnit, JaCoCo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        working-directory: backend
        env:
          TZ: UTC
          JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
          JWT_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          JWT_EXPIRATION_SECONDS: '1800'
        run: mvn -B -ntp test

      - name: Upload backend test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          if-no-files-found: warn

  frontend-unit-tests:
    name: Frontend (Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm test

      - run: npm run build

  frontend-e2e-tests:
    name: Frontend (Playwright Chromium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore

  openapi-validation:
    name: OpenAPI Validation (Redocly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate API documentation
        run: npx --yes @redocly/cli lint docs/api/openapi.yaml

      - name: Validate Swagger UI specification
        run: npx --yes @redocly/cli lint backend/src/main/resources/static/openapi.yaml

      - name: Verify specifications are identical
        run: diff -u docs/api/openapi.yaml backend/src/main/resources/static/openapi.yaml
