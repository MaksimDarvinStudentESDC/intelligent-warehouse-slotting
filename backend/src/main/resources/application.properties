# Application
spring.application.name=warehouse-slotting

# PostgreSQL connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/warehouse_slotting}
spring.datasource.username=${DB_APP_USERNAME:warehouse_app}
spring.datasource.password=${DB_APP_PASSWORD}

# Database driver
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5433/warehouse_slotting}
spring.flyway.user=${DB_MIGRATOR_USERNAME:warehouse_migrator}
spring.flyway.password=${DB_MIGRATOR_PASSWORD}
spring.flyway.locations=classpath:db/migration

# Swagger UI - use custom OpenAPI specification
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/openapi.yaml
springdoc.swagger-ui.disable-swagger-default-url=true
