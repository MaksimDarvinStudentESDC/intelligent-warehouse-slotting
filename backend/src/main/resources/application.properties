# Application
spring.application.name=warehouse-slotting

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/warehouse_slotting
spring.datasource.username=warehouse_migrator
spring.datasource.password=${DB_MIGRATOR_PASSWORD}

# Database driver
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
