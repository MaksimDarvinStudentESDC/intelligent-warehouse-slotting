openapi: 3.0.3
info:
  title: Intelligent Warehouse Slotting Optimization System API
  version: 0.1.0
  description: Documented REST API for the current implementation. Recommendations support nearest_feasible and
    weighted_score. ApiExceptionHandler maps business exceptions to HTTP 400, 404 or 409 using sendError. Spring
    Boot renders the error body; detailed exception messages are not guaranteed in JSON.
servers:
- url: http://localhost:8080
  description: Local development
tags:
- name: Catalog
  description: Product catalog and incoming batch registration.
- name: Warehouse
  description: Warehouse batches and storage locations.
- name: Classification
  description: ABC/XYZ demand classification.
- name: Constraints
  description: Storage feasibility and hard constraints.
- name: Recommendations
  description: Ranked storage location recommendations.
paths:
  /api/products:
    post:
      tags:
      - Catalog
      summary: Create a product
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
              example:
                id: 5
                sku: API-TEST-003
                name: Warehouse API Test Product
                unitVolumeDm3: 9
                unitWeightKg: 2.5
        '400':
          description: Invalid request or compatibility group; response body is determined by Spring Boot error
            configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpringBootErrorResponse'
              example:
                timestamp: '2026-11-22T15:44:14.268+00:00'
                status: 400
                error: Bad Request
                path: /api/products
        '404':
          description: Warehouse not found; response body is determined by Spring Boot error configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpringBootErrorResponse'
              example:
                timestamp: '2026-11-22T15:44:14.268+00:00'
                status: 404
                error: Not Found
                path: /api/products
        '409':
          description: SKU already exists in warehouse; response body is determined by Spring Boot error configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpringBootErrorResponse'
              example:
                timestamp: '2026-11-22T15:44:14.268+00:00'
                status: 409
                error: Conflict
                path: /api/products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
            example:
              warehouseId: 1
              sku: SKU-001
              name: Example product
              lengthMm: 200
              widthMm: 150
              heightMm: 100
              unitWeightKg: 1.25
              compatibilityGroupId: null
              shelfLifeDays: 90
              outboundFlow: PICKING
      operationId: createProduct
  /api/batches:
    post:
      tags:
      - Catalog
      summary: Register an incoming batch
      responses:
        '201':
          description: Batch registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
              example:
                id: 5
                batchCode: API-BATCH-001
                quantity: 50
                volumeDm3: 450
                weightKg: 125
                receivingDate: '2026-11-22'
                expiryDate: '2027-11-22'
                status: AWAITING_PUTAWAY
        '400':
          description: Invalid request, archived product or expiry date not after receiving date; response body
            is determined by Spring Boot error configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpringBootErrorResponse'
              example:
                timestamp: '2026-11-22T15:44:14.268+00:00'
                status: 400
                error: Bad Request
                path: /api/batches
        '404':
          description: Product not found; response body is determined by Spring Boot error configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpringBootErrorResponse'
              example:
                timestamp: '2026-11-22T15:44:14.268+00:00'
                status: 404
                error: Not Found
                path: /api/batches
        '409':
          description: Batch code already exists in warehouse; response body is determined by Spring Boot error
            configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpringBootErrorResponse'
              example:
                timestamp: '2026-11-22T15:44:14.268+00:00'
                status: 409
                error: Conflict
                path: /api/batches
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBatchRequest'
            example:
              productId: 10
              batchCode: BATCH-001
              quantity: 12
              receivingDate: '2026-11-22'
              expiryDate: '2027-02-20'
      operationId: createBatch
  /api/warehouses/{warehouseId}/batches:
    get:
      tags:
      - Warehouse
      summary: List warehouse batches
      responses:
        '200':
          description: Batch list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BatchResponse'
              example:
              - id: 25
                batchCode: BATCH-001
                quantity: 12
                volumeDm3: 36
                weightKg: 15
                receivingDate: '2026-11-22'
                expiryDate: '2027-02-20'
                status: AWAITING_PUTAWAY
        '400':
          description: Invalid numeric path parameter; rejected by Spring MVC.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpringBootErrorResponse'
              example:
                timestamp: '2026-11-22T15:44:14.268+00:00'
                status: 400
                error: Bad Request
                path: /api/warehouses/invalid/batches
      parameters:
      - name: warehouseId
        in: path
        required: true
        description: Identifier
        schema:
          type: integer
          format: int64
        example: 1
      operationId: getWarehouseBatches
  /api/warehouses/{warehouseId}/locations:
    get:
      tags:
      - Warehouse
      summary: List active warehouse locations
      responses:
        '200':
          description: Active locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationResponse'
              example:
              - id: 7
                code: A-01-01
                zoneId: 2
                capacityDm3: 500
                occupiedDm3: 100
                maxWeightKg: 250
                distanceToReceivingM: 15
                distanceToPickingM: 8
                distanceToShippingM: 20
                active: true
        '400':
          description: Invalid numeric path parameter; rejected by Spring MVC.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpringBootErrorResponse'
              example:
                timestamp: '2026-11-22T15:44:14.268+00:00'
                status: 400
                error: Bad Request
                path: /api/warehouses/invalid/locations
      parameters:
      - name: warehouseId
        in: path
        required: true
        description: Identifier
        schema:
          type: integer
          format: int64
        example: 1
      operationId: getWarehouseLocations
  /api/classifications/run:
    post:
      tags:
      - Classification
      summary: Run and persist ABC/XYZ classification
      responses:
        '201':
          description: Classification run persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationResult'
              example:
                runId: 2
                warehouseId: 1
                windowStart: '2026-10-01'
                windowEnd: '2026-11-22'
                products:
                - productId: 1
                  sku: DEMO-001
                  abcClass: A
                  xyzClass: X
                  movementCount: 969
                  cumulativeShare: 0.67715
                  cv: 0.2004
                  note: null
                - productId: 2
                  sku: POSTMAN-001
                  abcClass: A
                  xyzClass: Y
                  movementCount: 462
                  cumulativeShare: 1
                  cv: 0.5489
                  note: null
                - productId: 5
                  sku: API-TEST-003
                  abcClass: C
                  xyzClass: null
                  movementCount: 0
                  cumulativeShare: 1
                  cv: null
                  note: no data
        '400':
          description: Missing/invalid date range, too long a window, or warehouse is not LIVE; response body is
            determined by Spring Boot error configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpringBootErrorResponse'
              example:
                timestamp: '2026-11-22T15:44:14.268+00:00'
                status: 400
                error: Bad Request
                path: /api/classifications/run
        '404':
          description: Warehouse not found; response body is determined by Spring Boot error configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpringBootErrorResponse'
              example:
                timestamp: '2026-11-22T15:44:14.268+00:00'
                status: 404
                error: Not Found
                path: /api/classifications/run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunClassificationRequest'
            example:
              warehouseId: 1
              windowStart: '2026-10-01'
              windowEnd: '2026-10-31'
      description: Date window is inclusive; maximum allowed difference between dates is 3650 days. Request fields
        are checked in the service rather than Jakarta Bean Validation.
      operationId: runClassification
  /api/constraints/batches/{batchId}/locations/{locationId}:
    get:
      tags:
      - Constraints
      summary: Check whether a location can hold a batch
      responses:
        '200':
          description: Feasibility result, including rejection reasons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstraintCheckResponse'
              example:
                batchId: 25
                locationId: 7
                locationCode: A-01-01
                feasible: false
                rejectionReasons:
                - INSUFFICIENT_VOLUME
        '404':
          description: Batch or location not found; response body is determined by Spring Boot error configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpringBootErrorResponse'
              example:
                timestamp: '2026-11-22T15:44:14.268+00:00'
                status: 404
                error: Not Found
                path: /api/constraints/batches/5/locations/1
        '400':
          description: Invalid numeric path parameter; rejected by Spring MVC.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpringBootErrorResponse'
              example:
                timestamp: '2026-11-22T15:44:14.268+00:00'
                status: 400
                error: Bad Request
                path: /api/constraints/batches/invalid/locations/1
      parameters:
      - name: batchId
        in: path
        required: true
        description: Identifier
        schema:
          type: integer
          format: int64
        example: 1
      - name: locationId
        in: path
        required: true
        description: Identifier
        schema:
          type: integer
          format: int64
        example: 1
      description: 'A non-feasible location is reported with HTTP 200 and feasible=false, not as an HTTP error.
        Possible rejection codes: WAREHOUSE_MISMATCH, BATCH_NOT_AWAITING_PUTAWAY, LOCATION_INACTIVE, NOT_STORAGE_LOCATION,
        INSUFFICIENT_VOLUME, INSUFFICIENT_WEIGHT_CAPACITY, DIMENSIONS_EXCEEDED, INCOMPATIBLE_PRODUCTS.'
      operationId: evaluateConstraints
  /api/recommendations/batches/{batchId}:
    get:
      tags:
      - Recommendations
      summary: Rank feasible locations using nearest-feasible or weighted scoring
      responses:
        '200':
          description: Ranked feasible locations for the selected strategy; weighted_score items include scoreBreakdown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
              examples:
                nearestFeasible:
                  summary: Default distance-based ranking
                  value:
                    batchId: 5
                    strategy: nearest_feasible
                    feasibleCount: 4
                    recommendations:
                    - rank: 1
                      locationId: 9
                      locationCode: ST-09
                      distanceMeters: 35
                      explanation: Passes hard constraints; nearest feasible location by distance to picking (m)
                      scoreBreakdown: null
                    - rank: 2
                      locationId: 10
                      locationCode: ST-10
                      distanceMeters: 40
                      explanation: Passes hard constraints; nearest feasible location by distance to picking (m)
                      scoreBreakdown: null
                    - rank: 3
                      locationId: 11
                      locationCode: ST-11
                      distanceMeters: 45
                      explanation: Passes hard constraints; nearest feasible location by distance to picking (m)
                      scoreBreakdown: null
                    - rank: 4
                      locationId: 12
                      locationCode: ST-12
                      distanceMeters: 55
                      explanation: Passes hard constraints; nearest feasible location by distance to picking (m)
                      scoreBreakdown: null
                weightedScore:
                  summary: Illustrative weighted ranking (scores depend on current data and evaluation date)
                  value:
                    batchId: 5
                    strategy: weighted_score
                    feasibleCount: 4
                    recommendations:
                    - rank: 1
                      locationId: 9
                      locationCode: ST-09
                      distanceMeters: 35
                      explanation: Passes hard constraints; weighted score uses distance, ABC/XYZ, expiry accessibility
                        and volume fit
                      scoreBreakdown:
                        distance: 1.0
                        classification: 0.5
                        expiry: 0.5
                        utilization: 1.0
                        distanceContribution: 0.35
                        classificationContribution: 0.125
                        expiryContribution: 0.125
                        utilizationContribution: 0.15
                        total: 0.75
                        classificationMissing: true
                        expiryUnknown: true
        '400':
          description: Invalid topN (outside 1–100), unknown strategy, or expired batch with weighted_score. The
            error body depends on Spring Boot configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpringBootErrorResponse'
              example:
                timestamp: '2026-11-22T15:44:14.268+00:00'
                status: 400
                error: Bad Request
                path: /api/recommendations/batches/5
        '404':
          description: Batch not found. The error body depends on Spring Boot configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpringBootErrorResponse'
              example:
                timestamp: '2026-11-22T15:44:14.268+00:00'
                status: 404
                error: Not Found
                path: /api/recommendations/batches/5
      parameters:
      - name: batchId
        in: path
        required: true
        description: Identifier
        schema:
          type: integer
          format: int64
        example: 1
      - name: topN
        in: query
        required: false
        description: Maximum number of recommendations (default 5, allowed 1–100).
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 5
        example: 5
      - name: strategy
        in: query
        required: false
        description: Ranking strategy. Default nearest_feasible. Unknown values return HTTP 400.
        schema:
          type: string
          enum:
          - nearest_feasible
          - weighted_score
          default: nearest_feasible
        example: weighted_score
      description: Evaluates hard constraints before ranking locations. The default strategy nearest_feasible orders
        feasible locations by distance to the product outbound flow (PICKING or SHIPPING). The weighted_score strategy
        uses distance (35%), ABC/XYZ classification (25%), expiry accessibility (25%), and volume fit (15%). For
        weighted_score, scoreBreakdown explains the normalized components and weighted contributions. If no locations
        are feasible, returns 200 with an empty recommendations list. feasibleCount counts hard-constraint-feasible
        locations; weighted_score may omit locations with missing scoring inputs.
      operationId: getRecommendations
components:
  schemas:
    CreateProductRequest:
      type: object
      properties:
        warehouseId:
          type: integer
          format: int64
          example: 1
        sku:
          type: string
          example: SKU-001
        name:
          type: string
          example: Example product
        lengthMm:
          type: integer
          minimum: 1
          example: 200
        widthMm:
          type: integer
          minimum: 1
          example: 150
        heightMm:
          type: integer
          minimum: 1
          example: 100
        unitWeightKg:
          type: number
          exclusiveMinimum: true
          example: 1.25
          minimum: 0
        compatibilityGroupId:
          type: integer
          format: int64
          nullable: true
          example: null
        shelfLifeDays:
          type: integer
          minimum: 1
          nullable: true
          example: 90
        outboundFlow:
          type: string
          enum:
          - PICKING
          - SHIPPING
          example: PICKING
      required:
      - warehouseId
      - sku
      - name
      - lengthMm
      - widthMm
      - heightMm
      - unitWeightKg
      - outboundFlow
    ProductResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        sku:
          type: string
          example: SKU-001
        name:
          type: string
          example: Example product
        unitVolumeDm3:
          type: number
          example: 3
        unitWeightKg:
          type: number
          example: 1.25
    CreateBatchRequest:
      type: object
      properties:
        productId:
          type: integer
          format: int64
          example: 10
        batchCode:
          type: string
          example: BATCH-001
        quantity:
          type: integer
          minimum: 1
          example: 12
        receivingDate:
          type: string
          format: date
          example: '2026-11-22'
        expiryDate:
          type: string
          format: date
          nullable: true
          example: '2027-02-20'
      required:
      - productId
      - batchCode
      - quantity
      - receivingDate
    BatchResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 25
        batchCode:
          type: string
          example: BATCH-001
        quantity:
          type: integer
          example: 12
        volumeDm3:
          type: number
          example: 36
        weightKg:
          type: number
          example: 15
        receivingDate:
          type: string
          format: date
          example: '2026-11-22'
        expiryDate:
          type: string
          format: date
          nullable: true
          example: '2027-02-20'
        status:
          type: string
          enum:
          - AWAITING_PUTAWAY
          - PLACED
          example: AWAITING_PUTAWAY
    LocationResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 7
        code:
          type: string
          example: A-01-01
        zoneId:
          type: integer
          format: int64
          example: 2
        capacityDm3:
          type: number
          example: 500
        occupiedDm3:
          type: number
          example: 100
        maxWeightKg:
          type: number
          example: 250
        distanceToReceivingM:
          type: number
          example: 15
        distanceToPickingM:
          type: number
          example: 8
        distanceToShippingM:
          type: number
          example: 20
        active:
          type: boolean
          example: true
    RunClassificationRequest:
      type: object
      properties:
        warehouseId:
          type: integer
          format: int64
          example: 1
        windowStart:
          type: string
          format: date
          example: '2026-10-01'
        windowEnd:
          type: string
          format: date
          example: '2026-10-31'
    ProductClassification:
      type: object
      properties:
        productId:
          type: integer
          format: int64
          example: 10
        sku:
          type: string
          example: SKU-001
        abcClass:
          type: string
          enum:
          - A
          - B
          - C
          example: A
        xyzClass:
          type: string
          enum:
          - X
          - Y
          - Z
          - null
          nullable: true
          example: X
        movementCount:
          type: integer
          format: int64
          example: 40
        cumulativeShare:
          type: number
          nullable: true
          example: 0.8
        cv:
          type: number
          nullable: true
          example: 0.32
        note:
          type: string
          nullable: true
          example: null
    ClassificationResult:
      type: object
      properties:
        runId:
          type: integer
          format: int64
          example: 5
        warehouseId:
          type: integer
          format: int64
          example: 1
        windowStart:
          type: string
          format: date
          example: '2026-10-01'
        windowEnd:
          type: string
          format: date
          example: '2026-10-31'
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductClassification'
    ConstraintCheckResponse:
      type: object
      properties:
        batchId:
          type: integer
          format: int64
          example: 25
        locationId:
          type: integer
          format: int64
          example: 7
        locationCode:
          type: string
          example: A-01-01
        feasible:
          type: boolean
          example: true
        rejectionReasons:
          type: array
          items:
            type: string
          example: []
    RecommendationItemResponse:
      type: object
      properties:
        rank:
          type: integer
          example: 1
        locationId:
          type: integer
          format: int64
          example: 7
        locationCode:
          type: string
          example: A-01-01
        distanceMeters:
          type: number
          example: 8
        explanation:
          type: string
          example: Passes hard constraints; nearest feasible location by distance to picking (m)
          description: Human-readable ranking explanation; varies by strategy.
        scoreBreakdown:
          $ref: '#/components/schemas/ScoreBreakdown'
    RecommendationResponse:
      type: object
      properties:
        batchId:
          type: integer
          format: int64
          example: 25
        strategy:
          type: string
          enum:
          - nearest_feasible
          - weighted_score
          example: weighted_score
        feasibleCount:
          type: integer
          example: 3
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationItemResponse'
    SpringBootErrorResponse:
      type: object
      description: Default Spring Boot JSON error response observed in the development environment. ApiExceptionHandler
        sets the HTTP status and servlet error reason, not a custom JSON body. Additional fields depend on configuration.
      properties:
        timestamp:
          type: string
          format: date-time
          example: '2026-11-22T15:44:14.268+00:00'
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        path:
          type: string
          example: /api/recommendations/batches/5
      required:
      - timestamp
      - status
      - error
      - path
    ScoreBreakdown:
      type: object
      description: Normalized score components (0–1), weighted contributions, total and missing-data flags. The
        score is calculated for weighted_score only. Null for nearest_feasible.
      properties:
        distance:
          type: number
          format: double
          minimum: 0
          maximum: 1
        classification:
          type: number
          format: double
          minimum: 0
          maximum: 1
        expiry:
          type: number
          format: double
          minimum: 0
          maximum: 1
        utilization:
          type: number
          format: double
          minimum: 0
          maximum: 1
        distanceContribution:
          type: number
          format: double
          minimum: 0
          maximum: 1
        classificationContribution:
          type: number
          format: double
          minimum: 0
          maximum: 1
        expiryContribution:
          type: number
          format: double
          minimum: 0
          maximum: 1
        utilizationContribution:
          type: number
          format: double
          minimum: 0
          maximum: 1
        total:
          type: number
          format: double
          minimum: 0
          maximum: 1
        classificationMissing:
          type: boolean
        expiryUnknown:
          type: boolean
      nullable: true
security: []
